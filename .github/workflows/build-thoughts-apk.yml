name: Build Thoughts Android APK

on:
  push:
    branches: [thoughts-ai-inbox-mvp]
    # JS-only changes are delivered by EAS Update; rebuild APK only for native/config changes.
    paths:
      - 'thoughts-mvp/apps/mobile/app.config.js'
      - 'thoughts-mvp/apps/mobile/app.json'
      - 'thoughts-mvp/apps/mobile/eas.json'
      - 'thoughts-mvp/apps/mobile/package.json'
      - 'thoughts-mvp/apps/mobile/metro.config.js'
      - 'thoughts-mvp/apps/mobile/babel.config.js'
      - 'thoughts-mvp/package.json'
      - 'thoughts-mvp/package-lock.json'
      - '.github/workflows/build-thoughts-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      EXPO_EAS_PROJECT_ID: ${{ vars.EXPO_EAS_PROJECT_ID }}
    defaults:
      run:
        working-directory: thoughts-mvp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools' --channel=3
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"
      - name: Explain OTA status
        run: |
          if [ -z "$EXPO_EAS_PROJECT_ID" ]; then
            echo "::warning::EXPO_EAS_PROJECT_ID is not configured. This APK will NOT receive EAS updates. Set the GitHub variable and rebuild once."
          else
            node - <<'NODE'
            const {expo} = require('./apps/mobile/app.config.js');
            const id = process.env.EXPO_EAS_PROJECT_ID;
            if (!/^[0-9a-f]{8}-[0-9a-f-]{27,}$/i.test(id) ||
                expo.updates?.enabled !== true ||
                expo.updates?.url !== 'https://u.expo.dev/' + id ||
                expo.updates?.requestHeaders?.['expo-channel-name'] !== 'preview') {
              throw new Error('Invalid EAS preview project config; refusing to package a misleading APK');
            }
            console.log('Building preview-channel OTA-enabled APK');
            NODE
          fi
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate types
        run: npm run check:mobile
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --non-interactive
        working-directory: thoughts-mvp/apps/mobile
      - name: Check Expo entry point
        working-directory: thoughts-mvp/apps/mobile
        run: |
          test -f index.js
          ENTRY=$(node -e "require('expo/scripts/resolveAppEntry')" "$(pwd)" android absolute)
          echo "Expo Android entry: $ENTRY"
          test -n "$ENTRY"
          test -f "$ENTRY"
      - name: Build standalone signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        working-directory: thoughts-mvp/apps/mobile/android
        env:
          EXPO_PUBLIC_API_URL: http://localhost:4000
      - name: Verify APK signature
        run: |
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose "$APK"
          echo "APK created: $APK"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: thoughts-android-apk-${{ vars.EXPO_EAS_PROJECT_ID != '' && 'ota-enabled' || 'no-ota' }}
          path: thoughts-mvp/apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
