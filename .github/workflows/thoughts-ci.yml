name: Thoughts checks
on:
    push:
        branches: [master]
    pull_request:
        paths: ['thoughts-mvp/**', '.github/workflows/thoughts-*.yml']
    workflow_dispatch:
permissions:
    contents: read
jobs:
    check:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: thoughts-mvp
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: thoughts-mvp/package-lock.json
            - run: npm ci --no-audit --no-fund
            - run: npm run check:mobile
            - run: npm run lint
            - run: npm test
            - run: npx expo export --platform web --output-dir dist-web
              working-directory: thoughts-mvp/apps/mobile
